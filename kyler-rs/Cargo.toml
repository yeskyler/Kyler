[workspace]
resolver = "3"
members = [
    "crates/kyler-protocol",
    "crates/kyler-core",
    "crates/kyler-cli",
    "crates/kyler-client",
    "crates/kyler-config",
    "crates/kyler-logging",
    "crates/kyler-tui",
    "crates/kyler-server",
    "crates/kyler-evals",
]

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
percent-encoding = "2.3.2"
# local crates
kyler-protocol = { path = "crates/kyler-protocol" }
kyler-core = { path = "crates/kyler-core" }
kyler-cli = { path = "crates/kyler-cli" }
kyler-client = { path = "crates/kyler-client" }
kyler-config = { path = "crates/kyler-config" }
kyler-logging = { path = "crates/kyler-logging" }
kyler-tui = { path = "crates/kyler-tui" }
kyler-server = { path = "crates/kyler-server" }
kyler-evals = { path = "crates/kyler-evals" }

# external crates
rmcp = { version = "2.2.0", features = ["client","server","macros","transport-child-process","transport-io","transport-streamable-http-client-reqwest",]}
async-openai = {version = "0.41.0", features = ["chat-completion","embedding","byot"]}
anyhow = "1.0.102"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
schemars = "1.2.1"
async-stream = "0.3.6"
futures = "0.3.32"
backon = "1.6.0"
reqwest = { version = "0.13.4",features = ["json"] }
async-trait = "0.1.91"
uuid = {version = "1.24.0",features = ["v4"]}
chrono = "0.4"
toml = "0.8"
url = "2.5.8"
tiktoken-rs = "0.12.0"
base64 = "0.23.1"
csv = "1.4.0"
zip = "8.6.0"
mxc-sdk = "=1.0.1"
tempfile = "3.27.0"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4.5", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "underline-color"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.3"
unicode-width = "0.2"
unicode-segmentation = "1.12"

serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10"

libc = "0.2"
