[package]
name = "kyler-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "kyler"

[[bin]]
name = "kyler"
path = "src/main.rs"

[dependencies]
kyler-gateway.workspace = true
tar.workspace = true
flate2.workspace = true
kyler-provider.workspace = true
kyler-acp.workspace = true
async-trait.workspace = true
anyhow.workspace = true
kyler-client.workspace = true
kyler-tui.workspace = true
kyler-core.workspace = true
kyler-config.workspace = true
kyler-protocol.workspace = true
kyler-server.workspace = true
kyler-logging.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
indicatif.workspace = true
uuid.workspace = true
chrono.workspace = true
toml.workspace = true
crossterm.workspace = true
tempfile.workspace = true
reqwest.workspace = true
libc.workspace = true
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
inquire = { workspace = true, features = ["termion"] }

[target.'cfg(not(unix))'.dependencies]
inquire = { workspace = true, features = ["crossterm"] }

[dev-dependencies]
kyler-evals.workspace = true
axum.workspace = true
futures.workspace = true
async-stream.workspace = true
