[package]
name = "kyler-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Agent execution runtime and tools for Kyler"
exclude = ["datasets/**", "results/**", ".env", ".env.*"]

[dependencies]
kyler-provider.workspace = true
kyler-store.workspace = true
pulldown-cmark.workspace = true
percent-encoding.workspace = true
# local crates
kyler-protocol.workspace = true
kyler-config.workspace = true
kyler-mcp.workspace = true
kyler-skills.workspace = true

# external crates
anyhow.workspace = true
sha2.workspace = true
libc.workspace = true
async-openai.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
schemars.workspace = true
async-stream.workspace = true
futures.workspace = true
backon.workspace = true
reqwest.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
base64.workspace = true
tiktoken-rs.workspace = true
csv.workspace = true
zip.workspace = true

mxc-sdk.workspace = true
tempfile.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pdf-extract = "0.10"
quick-xml = "0.39"
url.workspace = true
calamine = "0.35"

[[bin]]
name = "kyler-tool-worker"
