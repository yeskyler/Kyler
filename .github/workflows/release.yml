name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and source
        run: |
          python3 - <<'PY'
          import importlib.util, os, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("release", "scripts/release.py")
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          if tag != "v" + version or not release.VERSION.fullmatch(version) or version != release.workspace_version():
              raise SystemExit("Tag must match the Rust workspace version")
          expected = subprocess.check_output(["git", "rev-parse", "refs/tags/" + tag + "^{commit}"], text=True).strip()
          if expected != subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip():
              raise SystemExit("Checkout does not match the version tag")
          if not Path("LICENSE").is_file():
              raise SystemExit("Project LICENSE is missing")
          PY
      - name: Test release scripts
        run: |
          python3 scripts/tests/test_release.py
          sh -n scripts/install.sh scripts/package.sh scripts/release.sh

  build:
    needs: [checks, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Select stable native Rust
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          rustc -vV | grep -Fx "host: $EXPECTED_TARGET"
      - name: Build complete bundle
        run: sh scripts/package.sh --download-node
      - name: Retain native release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kyler-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download native release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: kyler-*
          path: ${{ runner.temp }}/kyler-release-input
      - name: Validate all targets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/release.sh "$RELEASE_TAG" \
            --collect "$RUNNER_TEMP/kyler-release-input" \
            --artifacts "$RUNNER_TEMP/kyler-release-dist" \
            --require-existing-tag \
            --require-target aarch64-apple-darwin \
            --require-target x86_64-apple-darwin \
            --require-target x86_64-unknown-linux-gnu \
            --require-target aarch64-unknown-linux-gnu
