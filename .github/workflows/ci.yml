name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source revision to check
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: '2'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  rust:
    name: Rust (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev bubblewrap
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --manifest-path kyler-rs/Cargo.toml --all -- --check
      - name: Check workspace
        run: cargo check --manifest-path kyler-rs/Cargo.toml --workspace --locked
      - name: Test workspace
        run: cargo test --manifest-path kyler-rs/Cargo.toml --workspace --locked
      - name: Build CLI for installer integration tests
        run: cargo build --manifest-path kyler-rs/Cargo.toml -p kyler-cli --locked
      - name: Select Node.js for installer fixtures
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test installer and publisher
        run: |
          python3 scripts/tests/test_install.py
          python3 scripts/tests/test_release.py
          sh -n scripts/install.sh scripts/package.sh scripts/release.sh

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
